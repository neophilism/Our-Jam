version: 2.1

# Native CircleCI equivalent of ci.yml, e2eesa-status.yml and
# ios-simulator.yml. Do not mark production ready until the full jobs pass.
jobs:
  application-postgres-browser-docker:
    docker:
      - image: cimg/node:24.21.0-browsers
      - image: cimg/postgres:18.6
        environment:
          POSTGRES_USER: ourjam
          POSTGRES_PASSWORD: ourjam-ci-only
          POSTGRES_DB: ourjam_test
    resource_class: large
    environment:
      CI: "true"
      TEST_DATABASE_URL: postgresql://ourjam:ourjam-ci-only@127.0.0.1:5432/ourjam_test
    steps:
      - checkout
      - run:
          name: Install exact Node 24 dependencies
          command: npm ci
      - run:
          name: Install FFmpeg for audio media tests
          command: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run:
          name: Complete roadmap, typecheck, unit and database tests
          command: npm run check
      - run:
          name: Production application builds
          command: npm run build
      - run:
          name: Audit high or critical dependency vulnerabilities
          command: npm audit --audit-level=high
      - run:
          name: Install real Chromium browser
          command: npx playwright install --with-deps chromium
      - run:
          name: Desktop and mobile end-to-end browser tests
          command: npm run test:e2e
      - setup_remote_docker
      - run:
          name: Build real production Docker image
          command: docker build -t our-jam:ci .
      - run:
          name: Preserve exact tested local-source archive and digest
          command: |
            mkdir -p local-release
            git archive --format=zip --prefix=OurJam-Local/ HEAD > local-release/OurJam-Local-Source.zip
            git rev-parse HEAD > local-release/COMMIT.txt
            (cd local-release && sha256sum OurJam-Local-Source.zip > SHA256SUMS.txt)
            cp docs/local-real-rehearsal.md local-release/LOCAL-SETUP.md
            printf '%s\n' 'This is tracked source; it is not an iOS binary. CI acceptance is only valid for the exact tested commit.' > local-release/BUILD-STATUS.txt
      - store_artifacts:
          path: local-release
      - store_artifacts:
          path: test-results

  security-status-record:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Verify E2EESA evidence status (integrity, not certification)
          command: python3 scripts/validate_e2eesa_status.py

  real-ios-simulator:
    macos:
      xcode: 26.3.0
    resource_class: m4pro.medium
    environment:
      CI: "true"
    steps:
      - checkout
      - run:
          name: Install Node 24 dependencies
          command: |
            brew install node@24
            echo "export PATH=\"$(brew --prefix node@24)/bin:\$PATH\"" >> "$BASH_ENV"
            export PATH="$(brew --prefix node@24)/bin:$PATH"
            npm ci
      - run:
          name: Build local backend and web
          command: npm run build
      - run:
          name: Verify actual Apple Silicon simulator environment
          command: |
            mkdir -p ios-evidence ios-artifact
            uname -m | tee ios-evidence/runner-architecture.txt
            test "$(uname -m)" = arm64
            xcodebuild -version | tee ios-evidence/xcode-version.txt
            open -a Simulator
            python3 -c 'import subprocess; subprocess.run(["xcrun","simctl","list","devices","available","-j"],check=True,timeout=180)' > ios-evidence/initial-devices.json
      - run:
          name: Generate real Xcode project
          command: python3 apps/ios/make-project.py
      - run:
          name: Build real simulator app, with compilation evidence
          no_output_timeout: 15m
          command: |
            set -o pipefail
            xcodebuild -jobs 2 -project apps/ios/OurJam.xcodeproj -scheme OurJam -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios-build CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- ONLY_ACTIVE_ARCH=NO build 2>&1 | tee ios-evidence/build.log
      - run:
          name: Validate simulator signature and entitlements
          command: |
            codesign --verify --deep --strict ios-build/Build/Products/Release-iphonesimulator/OurJam.app
            codesign -d --entitlements :- ios-build/Build/Products/Release-iphonesimulator/OurJam.app > ios-evidence/simulator-entitlements.plist 2> ios-evidence/signature.log
      - run:
          name: Package built app and source with SHA-256 digests
          command: |
            ditto -c -k --sequesterRsrc --keepParent ios-build/Build/Products/Release-iphonesimulator/OurJam.app ios-artifact/OurJam-Simulator.zip
            cp 'apps/ios/Open Simulator.command' ios-artifact/
            cp apps/ios/README.md ios-artifact/README.md
            git archive --format=zip --prefix=OurJam-Local/ HEAD > ios-artifact/OurJam-Local-Source.zip
            cp docs/local-real-rehearsal.md ios-artifact/LOCAL-SETUP.md
            git rev-parse HEAD > ios-artifact/COMMIT.txt
            (cd ios-artifact && shasum -a 256 *.zip > SHA256SUMS.txt)
            printf '%s\n' 'Compiled simulator binary only; not a TestFlight release. Native interaction tests pending.' > ios-artifact/BUILD-STATUS.txt
      - run:
          name: Start real isolated native test backend
          command: |
            node --import tsx scripts/native-test-server.ts > ios-evidence/server.log 2>&1 &
            for i in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:4173/api/health; then exit 0; fi
              sleep 1
            done
            cat ios-evidence/server.log
            exit 1
      - run:
          name: Exercise actual iOS simulator and record evidence
          no_output_timeout: 15m
          command: |
            python3 scripts/run-native-simulator.py
            curl -fsS http://127.0.0.1:4173/__test__/native-evidence > ios-evidence/participation.json
      - run:
          name: Check native result on real public browser screen
          command: |
            npx playwright install chromium
            node scripts/native-stage-evidence.mjs
      - run:
          name: Mark real native acceptance only after all assertions pass
          command: |
            printf '%s\n' 'Native simulator interaction and native-to-public-screen checks passed on the exact commit; not TestFlight or full V1 certification.' > ios-artifact/BUILD-STATUS.txt
      - store_artifacts:
          path: ios-artifact
      - store_artifacts:
          path: ios-evidence

workflows:
  full-ci:
    jobs:
      - application-postgres-browser-docker
      - security-status-record
      - real-ios-simulator:
          requires:
            - application-postgres-browser-docker
