name: Publish portable Our-Jam OCI image
on:
  workflow_dispatch:
  pull_request:
    paths:
      - Dockerfile
      - .github/workflows/portable-image.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/portable-image.yml
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate only for publishing an accepted main release
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build tested deployable Node 24 + FFmpeg image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/neophilism/our-jam:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/neophilism/Our-Jam
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Release boundary
        run: |
          echo "Image build is not a live service. Provider account, secret migration and real HTTPS readiness still require separate acceptance." >> "$GITHUB_STEP_SUMMARY"
