name: Our Jam checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ourjam
          POSTGRES_PASSWORD: ourjam-ci-only
          POSTGRES_DB: ourjam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ourjam -d ourjam_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ourjam:ourjam-ci-only@localhost:5432/ourjam_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm run check
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: AST security scan and scanner regression suite
        run: node --test scripts/security-static-analysis.test.mjs && node scripts/security-static-analysis.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: docker build -t our-jam:ci .
      - name: Preserve exact checked local source
        run: |
          mkdir -p local-release
          git archive --format=zip --prefix=OurJam-Local/ HEAD > local-release/OurJam-Local-Source.zip
          git rev-parse HEAD > local-release/COMMIT.txt
          (cd local-release && sha256sum OurJam-Local-Source.zip > SHA256SUMS.txt)
          cp docs/local-real-rehearsal.md local-release/LOCAL-SETUP.md
          printf '%s\n' 'Application, browser, audit, production-build and Docker checks passed before packaging. This ZIP is exact tracked source, not an iOS binary or TestFlight build. Native acceptance is recorded by the separate Simulator workflow.' > local-release/BUILD-STATUS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OurJam-Local-Source
          path: local-release/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/
          retention-days: 7
