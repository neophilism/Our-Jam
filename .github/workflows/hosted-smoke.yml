name: Hosted rehearsal read-only smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify hosted rehearsal security and media readiness (no credentials or spending)
        env:
          OUR_JAM_REQUIRE_MEDIA_VERIFIED: "1"
        run: node scripts/check-hosted-readiness.mjs https://our-jam-rehearsal.onrender.com
