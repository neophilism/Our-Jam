name: Development commerce and identity acceptance
on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'db/**'
      - 'tests/features-browser/**'
      - 'scripts/commerce-test-server.ts'
      - 'playwright.features.config.ts'
      - 'package*.json'
      - '.github/workflows/feature-acceptance.yml'
permissions:
  contents: read
concurrency:
  group: feature-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  feature-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:features -- --repeat-each=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feature-browser-evidence
          path: test-results/
          retention-days: 7
